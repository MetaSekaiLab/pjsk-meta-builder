# pjsk-meta-builder 部署参考（设计文档 §8）。只在集群内网提供，不建 Ingress。
# 只用于首次创建：kubectl create -f，不要 apply（见 deploy/README.md）。之后镜像标签由 CI 通知 Ferry 更新，
# 配置在 Zeabur 面板里改，以集群里的现状为准，不再把这个文件应用到集群。
# 标签和命名按 Zeabur 面板的约定（app.kubernetes.io/name、<服务名>-env、端口名 http），面板能识别成一个服务。
# Secret pjsk-meta-builder-env 需事先创建（不要提交真实值），见 deploy/README.md。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pjsk-meta-builder
  namespace: apps
  labels: { app.kubernetes.io/name: pjsk-meta-builder }
spec:
  replicas: 1                      # 任务状态在内存里、同一时间只跑一个任务：只能单副本
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: pjsk-meta-builder }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pjsk-meta-builder }
    spec:
      automountServiceAccountToken: false   # 不访问 k8s API
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pjsk-meta-builder
          image: ghcr.io/metasekailab/pjsk-meta-builder:<12 位 commit sha>   # 用固定的 sha 标签，不用 latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef: { name: pjsk-meta-builder-env }
          env:
            - name: APP_META_REPO
              value: StarMoe-org/moesekai-app-meta
          resources:
            requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi }
            limits:   { cpu: "2",  memory: 3Gi, ephemeral-storage: 3Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 3Gi }   # 安装包（cn 约 560MB）+ 解密后的文件 + DummyDll，任务结束即删
---
apiVersion: v1
kind: Service
metadata:
  name: pjsk-meta-builder
  namespace: apps
  labels: { app.kubernetes.io/name: pjsk-meta-builder }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: pjsk-meta-builder }
  ports:
    - name: http
      port: 8080
      targetPort: http
